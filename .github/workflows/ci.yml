name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run it supersedes. Tag runs are never
# cancelled, so a release is not interrupted halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer computes the package version from tags and the commit height.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack
        run: |
          dotnet pack src/Authzn/Authzn.fsproj --no-build --configuration Release --output artifacts
          dotnet pack src/Authzn.CSharp/Authzn.CSharp.csproj --no-build --configuration Release --output artifacts

      - name: Package smoke test
        run: tests/PackageSmoke/run.sh artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: nupkgs
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the job request a GitHub OIDC token, which nuget.org Trusted Publishing exchanges
      # for a short-lived API key.
      id-token: write
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Only reviewed code is released: the tagged commit must already be on main.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi

      - name: Check the nuget.org user is set
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "::error::The repository has no NUGET_USER secret (the nuget.org profile name that owns the Trusted Publishing policy), so the packages cannot be published."
            exit 1
          fi

      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          name: nupkgs
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Exchanges the job's OIDC token for a nuget.org API key that is valid for one hour, so it is
      # requested just before the push.
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Publishes before the GitHub release is created, so a failed push leaves no release behind.
      # dotnet nuget push also pushes the .snupkg symbol package that sits next to each .nupkg, and
      # skips a version nuget.org already has, so re-running a tag's workflow is safe.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a pre-release label, such as v1.0.0-rc.1, makes a pre-release.
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --repo "$GITHUB_REPOSITORY" --generate-notes $prerelease
          fi
